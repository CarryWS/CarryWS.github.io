  <link rel="stylesheet" type="text/css" href="assets/css/main.css"/>
  <link rel="stylesheet" type="text/css" href="assets/css/jquery.terminal.min.css"/>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    /* 终端容器 */
    #terminal {
      margin: 30px auto 0;
      max-width: 600px;
      text-align: left;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #242836;
    }
    /* 覆盖 jQuery Terminal 默认背景，融入页面 */
    #terminal .terminal,
    #terminal .cmd,
    #terminal .cmd .cursor,
    #terminal .cmd .cursor.blink {
      background: transparent !important;
    }
    /* 网易云歌单悬浮方块 */
    #music-box {
      position: fixed;
      right: 24px;
      top: 90px;
      z-index: 9999;
      width: 330px;
      background: rgba(10, 12, 18, 0.94);
      border: 1px solid #2a2f3a;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #music-box .music-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #13161d;
      border-bottom: 1px solid #2a2f3a;
      cursor: move;
      color: #7ee787;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 2px;
    }
    #music-box .music-title::before {
      content: '♪ ';
      color: #58a6ff;
    }
    #music-box .music-close {
      cursor: pointer;
      color: #565d6e;
      font-size: 16px;
      line-height: 1;
      padding: 0 4px;
    }
    #music-box .music-close:hover {
      color: #58a6ff;
    }
    #music-box.collapsed iframe {
      display: none;
    }
    #music-box.collapsed {
      width: auto;
      min-width: 150px;
    }
    #music-box iframe {
      display: block;
      width: 330px;
      height: 430px;
      border: 0;
      background: #0a0c12;
    }
    /* M720Q 系统状态（左下角） */
    #sys-status {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 9999;
      padding: 8px 12px;
      background: rgba(10, 12, 18, 0.9);
      border: 1px solid #2a2f3a;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.9;
      color: #8b949e;
      letter-spacing: 1px;
      user-select: none;
      -webkit-user-select: none;
      text-align: left;
    }
    #sys-status .ss-line {
      white-space: nowrap;
      text-align: left;
    }
    #sys-status .ss-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: #565d6e;
      vertical-align: 1px;
    }
    #sys-status .ss-val {
      color: #7ee787;
    }
    #sys-status .ss-addr {
      color: #58a6ff;
      cursor: pointer;
      border-bottom: 1px dotted #58a6ff;
    }
  </style>
</head>

<body>
  <div class="vi">
    <!-- <h1 class="animate-slide-in-down">CarryWS</h1> -->

        <i class="icon icon-quotes-right"></i>

    <div class="ss-line"><span class="ss-dot" id="ss-mc-dot"></span> Minecraft Server <span class="ss-val" id="ss-mc">--/6</span> <span id="ss-addr" title="点击复制">carryws.xyz:25565 (click to copy)</span></div>

  <div id="music-box">
    <div class="music-bar" id="music-bar">
      <span class="music-title">THE PURE CYBERIA...</span>
      <span class="music-close" id="music-close">−</span>
    </div>
    <iframe src="https://music.163.com/outchain/player?type=0&amp;id=12519874787&amp;auto=0&amp;height=430" frameborder="no" marginwidth="0" marginheight="0" allowtransparency="true"></iframe>

  <script src="assets/vendors/jquery-3.3.1.min.js"></script>
  <script src="assets/vendors/jquery.terminal.min.js"></script>
  <script>
    $(function () {
      var SLIDE_IN_DOWN = { opacity: 1, top: 0 };
      var SLIDE_IN_UP = { opacity: 1, bottom: 0 };
      var SLIDE_IN_LEFT = { left: 0 };
      var SLIDE_IN_RIGHT = { right: 0 };

      executeAnimations();
      typewriterTitle();

      function executeAnimations() {
        $.when()
          .then(animateTitle)
          .then(animateQuote)
          .then(animateLinks)
          .then(animateLocation);
      }

      function animateTitle() {
        return animate('h1', SLIDE_IN_DOWN);
      }

      function animateQuote() {
        return $.when(
          animate('.quote-line-start', SLIDE_IN_LEFT),
          animate('.quote-line-end',SLIDE_IN_RIGHT),
          animate('.quote-icon-start', SLIDE_IN_DOWN),
          animate('.quote-icon-end', SLIDE_IN_UP)
        )
          .then(function () {
            return animate('.quote-content', SLIDE_IN_DOWN);
          })
          .then(function () {
            return animate('.quote-author', SLIDE_IN_DOWN);
          });
      }

      function animateLinks() {
        var DELAY_STEP = 200;
        var elements = $('.links a');
        var concurrent = $.makeArray(elements)
          .map(function (element, index) {
            return animate(element, SLIDE_IN_DOWN, index * DELAY_STEP);
          });

        return $.when.apply($, concurrent);
      }

      function animateLocation() {
        return $.when(
          animate('.location-icon', SLIDE_IN_UP),
          animate('.location-text', SLIDE_IN_DOWN)
        );
      }

      function animate(selector, properties, delay, options) {
        delay = delay || 0;
        return $(selector).delay(delay)
          .animate(properties, options)
          .promise();
      }

      // ---- Tab Title Scramble ----
      function typewriterTitle() {
        var texts = [
          'cout<<\"Hello world!\"<<endl;',
          'But, who am i?',
          'Where\'s my existence?',
          'make me sad, make me mad,',
          'make me feel alright?',
          '.',
          '..',
          '...',
          'SYSTEM OFFLINE',
          'NOW YOU WILL BE DESTRUCTED',
          'sudo rm -rf / --no-preserve-root',
          'DELETING CYBERIA LINUX...'
        ];
        var i = 0;
        var busy = false;

        // 随机可打印 ASCII 字符，模拟终端解码/编码
        function randomChar() {
          return String.fromCharCode(33 + Math.floor(Math.random() * 94));
        }

        function sleep(ms) {
          return new Promise(function(resolve) { setTimeout(resolve, ms); });
        }

        async function typeText(text) {
          var current = '';
          for (var j = 0; j < text.length; j++) {
            // 每个字符先经过 2~4 次随机 ASCII 闪烁，再"解码"为正确字符
            var flashes = 2 + Math.floor(Math.random() * 3);
            for (var k = 0; k < flashes; k++) {
              document.title = current + randomChar();
              await sleep(40 + Math.random() * 50);
            }
            current += text[j];
            document.title = current;
            await sleep(60 + Math.random() * 40);
          }
        }

        async function deleteText(text) {
          for (var j = text.length; j >= 0; j--) {
            // 最后一个字符先编码成乱码再消失
            if (j > 0) {
              var flashes = 1 + Math.floor(Math.random() * 2);
              for (var k = 0; k < flashes; k++) {
                document.title = text.substring(0, j - 1) + randomChar();
                await sleep(30 + Math.random() * 30);
              }
            }
            document.title = text.substring(0, j - 1);
            await sleep(40 + Math.random() * 30);
          }
        }

        async function loop() {
          while (true) {
            var text = texts[i % texts.length];
            await typeText(text);
            await sleep(2000);
            await deleteText(text);
            await sleep(400);
            i++;
          }
        }

        loop();
      }

      // ---- Terminal ----
      initTerminal();

      function initTerminal() {
        $('#terminal').terminal({

          help: function() {
            this.echo('');
            this.echo('  [[b;cyan;]Available commands:]');
            this.echo('  [[b;yellow;]help]       Show this message');
            this.echo('  [[b;yellow;]ls]   List directory')
            this.echo('  [[b;yellow;]whoami]     Who am I');
            this.echo('  [[b;yellow;]bilibili]   Open bilibili');
            this.echo('  [[b;yellow;]cat]   Get file context')
            this.echo('  [[b;yellow;]clear]      Clear screen');
            this.echo('  [[b;yellow;]echo ...]   Echo text back');
            this.echo('');
          },

          whoami: function() {
            this.echo('CarryWS');
          },

          bilibili: function() {
            this.echo('Opening bilibili...');
            window.open('https://space.bilibili.com/1100762947', '_blank');
          },

          clear: function() {
            this.clear();
          },

          echo: function(text) {
            this.echo(text);
          },

          ls: function(){
            this.echo('index.html\nreadme.md\nfavicon.png\n404.html\n[[b;red;]Secret.txt]');
          },

          cat: function(file){
            if (file=='Secret.txt')
            {
              this.echo('Access denied.')
            }
            else {
              this.echo('usage:\ncat [filename]')
            }
          },
        },


         {
          greetings: 'Cyberia Linux Ver:1.0\nWelcome to the realm of this euphoria.\nType [[b;yellow;]help] to see available commands.',
          prompt: '[[b;green;]visitor@carryws]:~$ ',
          height: 200,
          checkArity: false,
          history: true,
          historySize: 50,
          exit: false,
          keydown: function(e) {
            // 阻止页面快捷键冲突
          }
        });
      }
    });

    // ---- 网易云歌单悬浮方块：拖拽 + 位置记忆 ----
    (function () {
      var box = document.getElementById('music-box');
      var bar = document.getElementById('music-bar');
      var closeBtn = document.getElementById('music-close');
      if (!box || !bar) return;

      // 恢复上次位置与折叠状态
      try {
        var saved = JSON.parse(localStorage.getItem('musicBoxPos'));
        if (saved && typeof saved.left === 'number' && typeof saved.top === 'number') {
          box.style.right = 'auto';
          box.style.left = saved.left + 'px';
          box.style.top = saved.top + 'px';
        }
        if (saved && saved.collapsed) {
          box.classList.add('collapsed');
          closeBtn.textContent = '+';
        }
      } catch (e) {}

      var dragging = false, startX, startY, originX, originY;

      function onDown(e) {
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        var r = box.getBoundingClientRect();
        originX = r.left;
        originY = r.top;
        box.style.right = 'auto';
        box.style.left = originX + 'px';
        box.style.top = originY + 'px';
        e.preventDefault();
      }

      function onMove(e) {
        if (!dragging) return;
        var nx = originX + e.clientX - startX;
        var ny = originY + e.clientY - startY;
        // 限制在视口内
        nx = Math.max(0, Math.min(nx, window.innerWidth - box.offsetWidth));
        ny = Math.max(0, Math.min(ny, window.innerHeight - box.offsetHeight));
        box.style.left = nx + 'px';
        box.style.top = ny + 'px';
      }

      function onUp() {
        if (!dragging) return;
        dragging = false;
        try {
          localStorage.setItem('musicBoxPos', JSON.stringify({
            left: box.offsetLeft,
            top: box.offsetTop
          }));
        } catch (e) {}
      }

      // 鼠标
      bar.addEventListener('mousedown', onDown);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      // 触屏
      bar.addEventListener('touchstart', function (e) {
        var t = e.touches[0];
        onDown({ clientX: t.clientX, clientY: t.clientY, preventDefault: function () { e.preventDefault(); } });
      }, { passive: false });
      document.addEventListener('touchmove', function (e) {
        var t = e.touches[0];
        onMove({ clientX: t.clientX, clientY: t.clientY });
      }, { passive: false });
      document.addEventListener('touchend', onUp);

      // 折叠/展开按钮
      closeBtn.addEventListener('click', function () {
        var collapsed = box.classList.toggle('collapsed');
        closeBtn.textContent = collapsed ? '+' : '−';
        try {
          var s = JSON.parse(localStorage.getItem('musicBoxPos')) || {};
          s.collapsed = collapsed;
          s.left = box.offsetLeft;
          s.top = box.offsetTop;
          localStorage.setItem('musicBoxPos', JSON.stringify(s));
        } catch (e) {}
      });
    })();

    // ---- M720Q 系统状态（左下角，真实数据）----
    (function () {
      var el = document.getElementById('sys-status');
      if (!el) return;
      var cpu = document.getElementById('ss-cpu');
      var mem = document.getElementById('ss-mem');
      var temp = document.getElementById('ss-temp');
      var dot = document.getElementById('ss-dot');
      var mcDot = document.getElementById('ss-mc-dot');
      var mc = document.getElementById('ss-mc');
      var addr = document.getElementById('ss-addr');

      function setDot(elem, color) {
        elem.style.background = color;
        elem.style.boxShadow = '0 0 6px ' + color;
      }

      function update() {
        fetch('http://carryws.xyz:8787/status', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            cpu.textContent = (typeof d.cpu === 'number') ? d.cpu.toFixed(1) : '--';
            mem.textContent = (d.mem && typeof d.mem.percent === 'number') ? d.mem.percent.toFixed(1) : '--';
            temp.textContent = (typeof d.temp === 'number') ? d.temp.toFixed(1) : '--';
            setDot(dot, '#3fb950');
            if (d.mc && d.mc.online) {
              setDot(mcDot, '#3fb950');
              mc.textContent = d.mc.players + '/' + d.mc.max;
            } else {
              setDot(mcDot, '#f85149');
              mc.textContent = 'offline';
            }
          })
          .catch(function () {
            setDot(dot, '#f85149');
            setDot(mcDot, '#f85149');
            cpu.textContent = '--';
            mem.textContent = '--';
            temp.textContent = '--';
            mc.textContent = '?';
          });
      }

      update();
      setInterval(update, 30000);

      // 点击复制服务器地址
      addr.addEventListener('click', function () {
        var old = addr.textContent;
        navigator.clipboard.writeText('carryws.xyz:25565').then(function () {
          addr.textContent = 'copied!';
          setTimeout(function () { addr.textContent = old; }, 1500);
        }).catch(function () {
          addr.textContent = 'copy fail';
          setTimeout(function () { addr.textContent = old; }, 1500);
        });
      });
    })();
  </script>
