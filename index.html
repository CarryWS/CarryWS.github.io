  <script>(function(H){H.className=H.className.replace(/\bno-js\b/,'js')})(document.documentElement)</script>
  <script>
    /* 主题必须在首屏绘制前落定，否则浅色模式会先闪一下深色 */
    (function (H, M) {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      // 支持 ?theme=light|dark 强制指定（方便分享某个主题的链接，也便于回归截图）
      var forced = null;
      var m0 = /[?&]theme=(light|dark)\b/.exec(location.search);
      if (m0) forced = m0[1];
      var theme = forced || ((saved === 'light' || saved === 'dark')
        ? saved
        : (M && M.matches ? 'light' : 'dark'));
      if (forced) { try { localStorage.setItem('theme', forced); } catch (e) {} }
      H.setAttribute('data-theme', theme);
      var m = document.querySelector('meta[name="color-scheme"]');
      if (m) m.setAttribute('content', theme);
    })(document.documentElement, window.matchMedia && window.matchMedia('(prefers-color-scheme: light)'));
  </script>

  <script>
    // ---- 主题切换（浅色 / 深色）----
    // 首屏的 data-theme 由 <head> 内联脚本落定；切换逻辑在共享的 assets/js/theme.js。
    // 这里只负责按钮图标：切换后显示"将要切换过去"的那个图标。
    (function () {
      var icon = document.getElementById('theme-icon');
      if (!icon) return;

      function sync() {
        var light = document.documentElement.getAttribute('data-theme') === 'light';
        icon.className = 'icon ' + (light ? 'icon-moon' : 'icon-sun');
      }

      sync();
      window.addEventListener('themechange', sync);
    })();
  </script>

  <script src="assets/vendors/jquery-3.3.1.min.js"></script>  <script src="assets/vendors/jquery.terminal.min.js"></script>
  <script src="assets/vendors/aplayer/APlayer.min.js"></script>
  <script>
    $(function () {
      var SLIDE_IN_DOWN = { opacity: 1, top: 0 };
      var SLIDE_IN_UP = { opacity: 1, bottom: 0 };
      var SLIDE_IN_LEFT = { left: 0 };
      var SLIDE_IN_RIGHT = { right: 0 };

      executeAnimations();
      typewriterTitle();

      function executeAnimations() {
        $.when()
          .then(animateTitle)
          .then(animateQuote)
          .then(animateLinks)
          .then(animateLocation);
      }

      function animateTitle() {
        return animate('h1', SLIDE_IN_DOWN);
      }

      function animateQuote() {
        return $.when(
          animate('.quote-line-start', SLIDE_IN_LEFT),
          animate('.quote-line-end',SLIDE_IN_RIGHT),
          animate('.quote-icon-start', SLIDE_IN_DOWN),
          animate('.quote-icon-end', SLIDE_IN_UP)
        )
          .then(function () {
            return animate('.quote-content', SLIDE_IN_DOWN);
          })
          .then(function () {
            return animate('.quote-author', SLIDE_IN_DOWN);
          });
      }

      function animateLinks() {
        var DELAY_STEP = 200;
        var elements = $('.links a');
        var concurrent = $.makeArray(elements)
          .map(function (element, index) {
            return animate(element, SLIDE_IN_DOWN, index * DELAY_STEP);
          });

        return $.when.apply($, concurrent);
      }

      function animateLocation() {
        return $.when(
          animate('.location-icon', SLIDE_IN_UP),
          animate('.location-text', SLIDE_IN_DOWN)
        );
      }

      function animate(selector, properties, delay, options) {
        delay = delay || 0;
        return $(selector).delay(delay)
          .animate(properties, options)
          .promise();
      }

      // ---- Tab Title Scramble ----
      function typewriterTitle() {
        var texts = [
          'cout<<\"Hello world!\"<<endl;',
          'But, who am i?',
          'Where\'s my existence?',
          'make me sad, make me mad,',
          'make me feel alright?',
          '.',
          '..',
          '...',
          'SYSTEM OFFLINE',
          'NOW YOU WILL BE DESTRUCTED',
          'sudo rm -rf / --no-preserve-root',
          'DELETING CYBERIA LINUX...'
        ];
        var i = 0;
        var busy = false;

        // 随机可打印 ASCII 字符，模拟终端解码/编码
        function randomChar() {
          return String.fromCharCode(33 + Math.floor(Math.random() * 94));
        }

        function sleep(ms) {
          return new Promise(function(resolve) { setTimeout(resolve, ms); });
        }

        async function typeText(text) {
          var current = '';
          for (var j = 0; j < text.length; j++) {
            // 每个字符先经过 2~4 次随机 ASCII 闪烁，再"解码"为正确字符
            var flashes = 2 + Math.floor(Math.random() * 3);
            for (var k = 0; k < flashes; k++) {
              document.title = current + randomChar();
              await sleep(40 + Math.random() * 50);
            }
            current += text[j];
            document.title = current;
            await sleep(60 + Math.random() * 40);
          }
        }

        async function deleteText(text) {
          for (var j = text.length; j >= 0; j--) {
            // 最后一个字符先编码成乱码再消失
            if (j > 0) {
              var flashes = 1 + Math.floor(Math.random() * 2);
              for (var k = 0; k < flashes; k++) {
                document.title = text.substring(0, j - 1) + randomChar();
                await sleep(30 + Math.random() * 30);
              }
            }
            document.title = text.substring(0, j - 1);
            await sleep(40 + Math.random() * 30);
          }
        }

        async function loop() {
          while (true) {
            var text = texts[i % texts.length];
            await typeText(text);
            await sleep(2000);
            await deleteText(text);
            await sleep(400);
            i++;
          }
        }

        loop();
      }

      // ---- Terminal ----
      // 终端配色跟随主题：从 main.css 的 token 里取，浅色模式自动换成更深的 ANSI 色
      function token(name, fallback) {
        var v = getComputedStyle(document.documentElement).getPropertyValue(name);
        v = (v || '').trim();
        return v || fallback;
      }

      function terminalColors() {
        return {
          cyan: token('--term-cyan', 'cyan'),
          yellow: token('--term-yellow', 'yellow'),
          green: token('--term-green', 'green'),
          red: token('--term-red', 'red')
        };
      }

      function ansi(name, text) {
        return '[[;' + terminalColors()[name] + ';]' + text + ']';
      }

      initTerminal();

      function initTerminal() {
        var C = terminalColors();

        var term = $('#terminal').terminal({

          help: function() {
            this.echo('');
            this.echo('  [[b;' + C.cyan + ';]Available commands:]');
            this.echo('  [[b;' + C.yellow + ';]help]       Show this message');
            this.echo('  [[b;' + C.yellow + ';]ls]         List directory')
            this.echo('  [[b;' + C.yellow + ';]whoami]     Who am I');
            this.echo('  [[b;' + C.yellow + ';]bilibili]   Open bilibili');
            this.echo('  [[b;' + C.yellow + ';]cat]        Get file context')
            this.echo('  [[b;' + C.yellow + ';]clear]      Clear screen');
            this.echo('  [[b;' + C.yellow + ';]echo ...]   Echo text back');
            this.echo('');
          },

          whoami: function() {
            this.echo('CarryWS');
          },

          bilibili: function() {
            this.echo('Opening bilibili...');
            window.open('https://space.bilibili.com/1100762947', '_blank');
          },

          clear: function() {
            this.clear();
          },

          echo: function(text) {
            this.echo(text);
          },

          ls: function(){
            this.echo('index.html\nreadme.md\nfavicon.png\n404.html\n' + ansi('red', 'Secret.txt'));
          },

          cat: function(file){
            if (file=='Secret.txt')
            {
              this.echo('Access denied.')
            }
            else {
              this.echo('usage:\ncat [filename]')
            }
          },
        },


         {
          greetings: 'Cyberia Linux Ver:1.0\nWelcome to the realm of this euphoria.\nType [[b;' + C.yellow + ';]help] to see available commands.',
          prompt: '[[b;' + C.green + ';]visitor@carryws]:~$ ',
          height: 200,
          checkArity: false,
          history: true,
          historySize: 50,
          exit: false,
          keydown: function(e) {
            // 阻止页面快捷键冲突
          }
        });

        // 主题切换后重绘终端里已输出的 ANSI 颜色（不重建实例，保留历史）
        window.addEventListener('themechange', function () {
          var after = terminalColors();
          var before = C;
          var keys = ['cyan', 'yellow', 'green', 'red'];

          Array.prototype.forEach.call(
            document.querySelectorAll('#terminal .terminal-output span'),
            function (el) {
              var computed = el.style.color || getComputedStyle(el).color;
              keys.forEach(function (name) {
                if (normalize(computed) === normalize(before[name])) {
                  el.style.color = after[name];
                }
              });
            }
          );

          C = after;
          if (term && term.css) {
            term.css({ color: token('--fg', '#6C7486') });
          }
        });

        // 把 CSS 颜色统一成 rgb() 形式，便于比较（'cyan' 与 'rgb(0,255,255)' 视为相同）
        function normalize(color) {
          if (!color) return '';
          var probe = document.createElement('span');
          probe.style.color = color;
          if (!probe.style.color) return String(color).toLowerCase();
          document.body.appendChild(probe);
          var out = getComputedStyle(probe).color;
          document.body.removeChild(probe);
          return out;
        }
      }
    });

    // ---- 网易云歌单播放器：APlayer + Meting 公共接口（多接口自动回退）----
    // 旧版 music.163.com/outchain/player iframe 在第三方站点跨域嵌入时会被
    // 同源策略拦截（SecurityError: Blocked a frame ... accessing a cross-origin frame），
    // 已弃用，改为自绘 HTML5 播放器。
    (function () {
      var host = document.getElementById('music-player');
      if (!host || !window.APlayer || !window.fetch) return;

      var PLAYLIST_ID = '12519874787';
      // 按顺序尝试，第一个可用的生效；想换后端改这里即可
      var APIS = [
        'https://api.injahow.cn/meting/',
        'https://meting.mysqil.com/api',
        'https://api.i-meto.com/meting/api'
      ];

      function endpoint(api) {
        return api + (api.indexOf('?') > -1 ? '' : '?') +
          'server=netease&type=playlist&id=' + PLAYLIST_ID + '&r=' + Math.random();
      }

      function showError() {
        host.innerHTML = '<div class="music-error">' +
          '歌单加载失败：公共解析接口暂时不可用。<br>' +
          '<a href="https://music.163.com/#/playlist?id=' + PLAYLIST_ID + '" target="_blank" rel="noopener">在网易云中打开这个歌单 →</a>' +
          '</div>';
      }

      function load(index) {
        if (index >= APIS.length) { showError(); return; }
        fetch(endpoint(APIS[index]))
          .then(function (res) {
            if (!res.ok) throw new Error('http ' + res.status);
            return res.json();
          })
          .then(function (list) {
            if (!Array.isArray(list) || !list.length) throw new Error('empty playlist');
            var tracks = list.map(function (t) {
              return {
                name: t.name || t.title || '未知曲目',
                artist: t.artist || t.author || 'CarryWS',
                url: t.url,
                cover: t.cover || t.pic || '',
                lrc: t.lrc || t.lyric || '',
                type: 'normal'
              };
            }).filter(function (t) {
              return !!t.url;
            });
            if (!tracks.length) throw new Error('no playable url');

            new APlayer({
              container: host,
              audio: tracks,
              theme: (function () {
                var v = getComputedStyle(document.documentElement).getPropertyValue('--accent');
                return (v || '').trim() || '#58a6ff';
              })(),
              lrcType: 3,
              preload: 'none',
              mutex: true,
              listFolded: false,
              listMaxHeight: '300px',
              storageName: 'carryws-music'
            });
          })
          .catch(function () { load(index + 1); });
      }

      load(0);
    })();

    // ---- 网易云歌单悬浮方块：拖拽 + 位置记忆 ----
    (function () {
      var box = document.getElementById('music-box');
      var bar = document.getElementById('music-bar');
      var closeBtn = document.getElementById('music-close');
      if (!box || !bar) return;

      // 恢复上次位置与折叠状态
      try {
        var saved = JSON.parse(localStorage.getItem('musicBoxPos'));
        if (saved && typeof saved.left === 'number' && typeof saved.top === 'number') {
          // 视口变小后旧坐标可能把方块挤到屏幕外，恢复时先夹回可视范围
          saved.left = Math.max(0, Math.min(saved.left, window.innerWidth - box.offsetWidth));
          saved.top = Math.max(0, Math.min(saved.top, window.innerHeight - box.offsetHeight));
          box.style.right = 'auto';
          box.style.left = saved.left + 'px';
          box.style.top = saved.top + 'px';
        }
        if (saved && saved.collapsed) {
          box.classList.add('collapsed');
          closeBtn.textContent = '+';
        }
      } catch (e) {}

      var dragging = false, startX, startY, originX, originY;

      function onDown(e) {
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        var r = box.getBoundingClientRect();
        originX = r.left;
        originY = r.top;
        box.style.right = 'auto';
        box.style.left = originX + 'px';
        box.style.top = originY + 'px';
        e.preventDefault();
      }

      function onMove(e) {
        if (!dragging) return;
        var nx = originX + e.clientX - startX;
        var ny = originY + e.clientY - startY;
        // 限制在视口内
        nx = Math.max(0, Math.min(nx, window.innerWidth - box.offsetWidth));
        ny = Math.max(0, Math.min(ny, window.innerHeight - box.offsetHeight));
        box.style.left = nx + 'px';
        box.style.top = ny + 'px';
      }

      function onUp() {
        if (!dragging) return;
        dragging = false;
        try {
          localStorage.setItem('musicBoxPos', JSON.stringify({
            left: box.offsetLeft,
            top: box.offsetTop
          }));
        } catch (e) {}
      }

      // 鼠标
      bar.addEventListener('mousedown', onDown);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      // 触屏
      bar.addEventListener('touchstart', function (e) {
        var t = e.touches[0];
        onDown({ clientX: t.clientX, clientY: t.clientY, preventDefault: function () { e.preventDefault(); } });
      }, { passive: false });
      document.addEventListener('touchmove', function (e) {
        var t = e.touches[0];
        onMove({ clientX: t.clientX, clientY: t.clientY });
      }, { passive: false });
      document.addEventListener('touchend', onUp);

      // 折叠/展开按钮
      closeBtn.addEventListener('click', function () {
        var collapsed = box.classList.toggle('collapsed');
        closeBtn.textContent = collapsed ? '+' : '−';
        try {
          var s = JSON.parse(localStorage.getItem('musicBoxPos')) || {};
          s.collapsed = collapsed;
          s.left = box.offsetLeft;
          s.top = box.offsetTop;
          localStorage.setItem('musicBoxPos', JSON.stringify(s));
        } catch (e) {}
      });
    })();

    // ---- M720Q 系统状态（左下角，真实数据）----
    (function () {
      var el = document.getElementById('sys-status');
      if (!el) return;
      var cpu = document.getElementById('ss-cpu');
      var mem = document.getElementById('ss-mem');
      var temp = document.getElementById('ss-temp');
      var dot = document.getElementById('ss-dot');
      var mcDot = document.getElementById('ss-mc-dot');
      var mc = document.getElementById('ss-mc');
      var addr = document.getElementById('ss-addr');

      function setDot(elem, color) {
        elem.style.background = color;
        elem.style.boxShadow = '0 0 6px ' + color;
      }

      function update() {
        fetch('/api/status', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            cpu.textContent = (typeof d.cpu === 'number') ? d.cpu.toFixed(1) : '--';
            mem.textContent = (d.mem && typeof d.mem.percent === 'number') ? d.mem.percent.toFixed(1) : '--';
            temp.textContent = (typeof d.temp === 'number') ? d.temp.toFixed(1) : '--';
            setDot(dot, '#3fb950');
            if (d.mc && d.mc.online) {
              setDot(mcDot, '#3fb950');
              mc.textContent = d.mc.players + '/' + d.mc.max;
            } else {
              setDot(mcDot, '#f85149');
              mc.textContent = 'offline';
            }
          })
          .catch(function () {
            setDot(dot, '#f85149');
            setDot(mcDot, '#f85149');
            cpu.textContent = '--';
            mem.textContent = '--';
            temp.textContent = '--';
            mc.textContent = '?';
          });
      }

      update();
      setInterval(update, 30000);

      // 点击复制服务器地址（兼容 http 非安全上下文）
      addr.addEventListener('click', function () {
        var old = addr.textContent;
        var done = function () {
          addr.textContent = 'copied!';
          setTimeout(function () { addr.textContent = old; }, 1500);
        };
        var fail = function () {
          addr.textContent = 'copy fail';
          setTimeout(function () { addr.textContent = old; }, 1500);
        };
        var text = 'carryws.xyz:25565';
        // 安全上下文（https/localhost/file）用 Clipboard API
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(done).catch(fail);
          return;
        }
        // http 环境降级方案
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          done();
        } catch (e) {
          fail();
        }
        document.body.removeChild(ta);
      });
    })();
  </script>
